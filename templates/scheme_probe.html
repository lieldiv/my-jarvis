<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>האם השעון נפתח? — J.A.R.V.I.S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rubik:wght@400;500;700&family=Share+Tech+Mono&display=swap">
<style>
:root{
  --ground:#04070e; --panel:#0a121f; --panel-lift:#0e1a2c;
  --edge:rgba(0,243,255,.22); --accent:#00f3ff;
  --ink:#e9f6fb; --ink-dim:#7fa6bd;
  --good:#00ff88; --bad:#ff5a5a; --wait:#ffc800;
  --font-display:'Orbitron','Rubik',sans-serif;
  --font-body:'Rubik',system-ui,sans-serif;
  --font-mono:'Share Tech Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink); font-family:var(--font-body);
  margin:0; padding:22px 16px 60px; line-height:1.6; -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--font-display);font-weight:700;font-size:25px;margin:0;line-height:1.25;text-wrap:balance}
.lede{margin:0;color:var(--ink-dim);font-size:14.5px}
.note{background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:13px 15px;font-size:13.5px;color:var(--ink-dim)}
.note strong{color:var(--ink);font-weight:700}
#tests{display:flex;flex-direction:column;gap:14px}
.test{
  background:var(--panel);border:1px solid var(--edge);border-radius:6px;
  padding:16px;display:flex;flex-direction:column;gap:11px;
  border-inline-start:3px solid var(--edge);
}
.test[data-state="ok"]{border-inline-start-color:var(--good)}
.test[data-state="no"]{border-inline-start-color:var(--bad)}
.test[data-state="pending"]{border-inline-start-color:var(--wait)}
.test-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.test-name{font-family:var(--font-display);font-weight:500;font-size:15px;margin:0}
.verdict{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--ink-dim)}
.test[data-state="ok"] .verdict{color:var(--good)}
.test[data-state="no"] .verdict{color:var(--bad)}
.test[data-state="pending"] .verdict{color:var(--wait)}
.why{margin:0;font-size:13.5px;color:var(--ink-dim)}
.why b{color:var(--ink);font-weight:500}
code{
  display:block;direction:ltr;text-align:left;font-family:var(--font-mono);font-size:12.5px;
  color:var(--accent);background:#020509;border:1px solid rgba(0,243,255,.14);
  border-radius:3px;padding:9px 11px;overflow-x:auto;white-space:nowrap;
}
button{
  font-family:var(--font-body);font-size:14px;font-weight:700;border-radius:4px;
  cursor:pointer;padding:13px;background:none;color:var(--ink);
  border:1px solid var(--edge);transition:background .15s ease,border-color .15s ease;
}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.try{width:100%;background:rgba(0,243,255,.11);border-color:rgba(0,243,255,.5);font-family:var(--font-display);font-weight:500;letter-spacing:.04em}
.try:active{background:rgba(0,243,255,.22)}
.answer{display:flex;gap:9px}
.answer button{flex:1}
.yes{border-color:rgba(0,255,136,.45);color:var(--good)}
.no{border-color:rgba(255,90,90,.45);color:var(--bad)}
.ask{margin:0;font-size:13px;color:var(--wait);font-weight:500}
[hidden]{display:none!important}
.summary{background:var(--panel-lift);border:1px solid var(--edge);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px}
.summary h2{font-family:var(--font-display);font-size:14px;margin:0;font-weight:500}
#summary-lines{margin:0;font-family:var(--font-mono);font-size:12.5px;direction:ltr;text-align:left;white-space:pre-wrap;color:var(--ink-dim)}
.reset{align-self:flex-start;font-size:12.5px;padding:8px 14px;color:var(--ink-dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">J.A.R.V.I.S · אבחון</div>
    <h1>האם השעון נפתח?</h1>
    <p class="lede">ארבע בדיקות, הקשה אחת כל אחת. אחרי כל הקשה — חזור לדף הזה ותגיד מה קרה.</p>
  </header>

  <div class="note">
    <strong>חייב להיפתח באייפון עצמו.</strong> במחשב זה חסר משמעות — הסכמות
    האלה שייכות ל-iOS.
  </div>

  <div id="tests"></div>

  <div class="summary">
    <h2>הסיכום — זה מה שתשלח לי</h2>
    <pre id="summary-lines">עדיין לא נבדק כלום.</pre>
    <button class="reset" onclick="resetAll()">אפס הכל</button>
  </div>
</div>

<script>
/* Four probes, ordered so the answer reads top-down: the one we actually need,
   its sibling (does the family work at all?), the fallback route, and a control
   that is known to work — without which "nothing happened" can't be told apart
   from "this page is broken". */
const TESTS = [
  { id: 'clock-alarm', name: 'שעון — לשונית מעוררים',
    why: 'זו <b>הבדיקה האמיתית</b>. אם זה עובד, JARVIS יוכל לפתוח לך את השעון ישירות על המעוררים.',
    url: 'clock-alarm://' },
  { id: 'clock-timer', name: 'שעון — טיימר',
    why: 'אותה משפחת סכמות. אם זה עובד והראשון לא — הבעיה ספציפית למעוררים, לא לשעון.',
    url: 'clock-timer://' },
  { id: 'shortcuts', name: 'אפליקציית Shortcuts',
    why: 'מסלול הגיבוי. אם זה עובד, אפשר ליצור <b>מעורר אמיתי</b> דרך קיצור — לא רק לפתוח אפליקציה.',
    url: 'shortcuts://' },
  { id: 'waze', name: 'Waze — ביקורת',
    why: 'זה <b>אמור</b> לעבוד — זה בדיוק מה שכבר בנינו. אם דווקא זה נכשל, הבעיה בדף הזה ולא בסכמות.',
    url: 'https://waze.com/ul?q=%D7%AA%D7%9C%20%D7%90%D7%91%D7%99%D7%91&navigate=yes' },
];

const KEY = 'jarvis_scheme_probe';
const VERDICTS = { ok: 'נפתח ✓', no: 'כלום', pending: 'ממתין לתשובה', '': 'לא נבדק' };

function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
function save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }

function render(){
  const state = load();
  const box = document.getElementById('tests');
  box.innerHTML = '';
  TESTS.forEach(t => {
    const s = state[t.id] || '';
    const card = document.createElement('div');
    card.className = 'test';
    card.dataset.state = s;
    card.innerHTML =
      '<div class="test-head"><h3 class="test-name">' + t.name + '</h3>' +
      '<span class="verdict">' + VERDICTS[s] + '</span></div>' +
      '<p class="why">' + t.why + '</p>' +
      '<code>' + (t.url.length > 46 ? t.url.slice(0, 46) + '…' : t.url) + '</code>' +
      '<button class="try">' + (s ? 'נסה שוב' : 'נסה') + '</button>' +
      '<p class="ask"' + (s === 'pending' ? '' : ' hidden') + '>חזרת? מה קרה?</p>' +
      '<div class="answer"' + (s === 'pending' ? '' : ' hidden') + '>' +
      '<button class="yes">✅ האפליקציה נפתחה</button>' +
      '<button class="no">✖ כלום לא קרה</button></div>';

    /* Marked pending BEFORE navigating: once the OS switches apps this page may
       be reloaded from scratch on the way back, so the question has to be
       already persisted or it is lost. */
    card.querySelector('.try').onclick = function(){
      const st = load(); st[t.id] = 'pending'; save(st);
      render();
      window.location.href = t.url;
    };
    card.querySelector('.yes').onclick = function(){ mark(t.id, 'ok'); };
    card.querySelector('.no').onclick = function(){ mark(t.id, 'no'); };
    box.appendChild(card);
  });
  renderSummary(state);
}

function mark(id, value){ const s = load(); s[id] = value; save(s); render(); }

function renderSummary(state){
  const out = document.getElementById('summary-lines');
  const done = TESTS.filter(function(t){ return state[t.id] === 'ok' || state[t.id] === 'no'; });
  if (!done.length) { out.textContent = 'עדיין לא נבדק כלום.'; return; }
  out.textContent = TESTS.map(function(t){
    const s = state[t.id];
    const mark = s === 'ok' ? 'WORKS  ' : s === 'no' ? 'NOTHING' : s === 'pending' ? '???    ' : '-      ';
    return mark + '  ' + t.url.split('?')[0];
  }).join('\n');
}

function resetAll(){ save({}); render(); }
render();
</script>
</body>
</html>
