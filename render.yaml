# Render Blueprint — see https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then "New +" -> "Blueprint" on Render
# and point it at the repo. Render reads this file and creates the service.
#
# FREE TIER (chosen deliberately — no card required): no persistent disk,
# so the free tier's own ephemeral filesystem would lose users.db (everyone's
# accounts/tokens/tasks/reminders) on every restart/deploy/idle spin-down.
# DATABASE_URL (a free Neon Postgres project) is the actual persistence
# fix — see users.py's own module docstring for why Postgres/psycopg2 was
# chosen over Turso/libsql (a real server-enforced statement_timeout that
# libsql had no equivalent of). Local dev with no DATABASE_URL set is
# unaffected — falls back to a local sqlite3 file as always.
#
# Before the first deploy:
#   1. Comment out pyautogui/pygetwindow/Pillow/pywhatkit in requirements.txt
#      (see the note there) — they won't install on Render's Linux build.
#   2. Create a "Web application" type OAuth client in Google Cloud Console
#      (see google_service.py's docstring) with redirect URI:
#      https://<your-service-name>.onrender.com/auth/google/callback
#   3. Set the env vars below as actual secrets in the Render dashboard —
#      never commit real values into this file or into .env.
services:
  - type: web
    name: my-jarvis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # threads=16: each open browser tab holds one /api/stream (SSE) connection
    # open indefinitely, permanently pinning a thread for as long as the tab
    # stays open. With only 2 threads, two simultaneous tabs (e.g. desktop +
    # phone) exhausted the pool and made every other request — including
    # /auth/google/start — hang forever waiting for a free thread.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 16 --timeout 120
    envVars:
      - key: JARVIS_DESKTOP_TOOLS
        value: "false"
      - key: JARVIS_WEEKLY_SUMMARY
        value: "true"        # emails each connected user their week ahead — see daily_briefing.py
      - key: JARVIS_DB_PATH
        value: users.db       # only used as a fallback if DATABASE_URL isn't set — see note above
      - key: DATABASE_URL
        sync: false           # a free Neon Postgres connection string — set manually in the
                               # Render dashboard, e.g. postgresql://user:pass@host/db?sslmode=require
      - key: GROQ_API_KEY
        sync: false           # set manually in the Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false            # the "Web application" client, not the local Desktop one
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false            # generate once (e.g. `python -c "import secrets; print(secrets.token_hex(32))"`) and keep it stable across deploys
      - key: TAVILY_API_KEY
        sync: false            # free, no card — https://tavily.com — powers get_current_info
      - key: VAPID_PRIVATE_KEY
        sync: false            # browser push notifications (push_service.py) — see that file's
                                # docstring for the one-time keygen snippet. Optional: reminders
                                # still email fine with this unset, push is just disabled.
      - key: VAPID_PUBLIC_KEY
        sync: false            # generated alongside VAPID_PRIVATE_KEY, same keygen snippet
      - key: VAPID_SUBJECT
        sync: false             # a real mailto: address — Apple's push relay has been reported
                                 # stricter than Chrome's about rejecting placeholder/example.com
                                 # subjects, and a baked-in "value:" here meant this shipped with
                                 # the exact placeholder push_service.py's own fallback also uses,
                                 # silently, unless someone happened to remember to overwrite it
